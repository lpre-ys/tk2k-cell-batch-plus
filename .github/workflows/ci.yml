name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rewrite git ssh -> https (tk2k-clipdata依存対策)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: npm ci
      - run: npm run lint:ci
      - run: npm run type-check
      - run: npm run test:ci
      - run: npm run build-only

  # package-lock.json からWindows用のプラットフォーム固有バイナリ
  # （@rolldown/binding-win32-x64-msvc 等）が欠落していないか検証する。
  # WSL側でnpmを実行するとlinux向けのものだけに絞られた lockfile が
  # 生成されるが、ubuntu-latest のCIでは検出できないため。
  windows-deps:
    name: npm ci (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rewrite git ssh -> https (tk2k-clipdata依存対策)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: npm ci
